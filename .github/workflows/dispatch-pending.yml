name: Dispatch GitLab SaaS runners

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: gitlab-saas-runner-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      GITLAB_API_URL: https://gitlab.com/api/v4
      GITLAB_PROJECT_ID: '81321701'
      GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
      RUNNER_TAG: saas-github-linux
      BUILD_RUNNER_TAG: saas-github-build
      RUNNER_WORKFLOW: gitlab-runner-linux.yml
      BUILD_RUNNER_WORKFLOW: gitlab-runner-linux-build.yml
      MAX_ACTIVE_RUNNERS: '16'

    steps:
      - name: Dispatch pending jobs
        run: |
          set -euo pipefail
          test -n "$GITLAB_READ_TOKEN"

          pending_json="$RUNNER_TEMP/pending-jobs.json"
          deadline=$((SECONDS + 240))

          while [ "$SECONDS" -lt "$deadline" ]; do
            curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
              -H "PRIVATE-TOKEN: $GITLAB_READ_TOKEN" \
              "$GITLAB_API_URL/projects/$GITLAB_PROJECT_ID/jobs?scope%5B%5D=pending&per_page=100" \
              -o "$pending_json"

            jq -e --arg tag "$RUNNER_TAG" '
              type == "array" and
              all(.[]; (.tag_list | type) == "array")
            ' "$pending_json" >/dev/null

            mapfile -t pending_test_jobs < <(
              jq -c --arg tag "$RUNNER_TAG" '
                .[]
                | select((.tag_list // []) | index($tag))
                | select((.pipeline.sha // "") | test("^[0-9a-f]{40,64}$"))
                | {cache_key: .pipeline.sha}
              ' "$pending_json"
            )
            mapfile -t pending_build_jobs < <(
              jq -c --arg tag "$BUILD_RUNNER_TAG" '
                .[]
                | select((.tag_list // []) | index($tag))
                | .id
              ' "$pending_json"
            )

            active_test_count="$(
              gh run list \
                --repo "$GH_REPO" \
                --workflow "$RUNNER_WORKFLOW" \
                --limit 100 \
                --json status \
                --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length'
            )"
            active_build_count="$(
              gh run list \
                --repo "$GH_REPO" \
                --workflow "$BUILD_RUNNER_WORKFLOW" \
                --limit 100 \
                --json status \
                --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length'
            )"
            test_count="${#pending_test_jobs[@]}"
            build_count="${#pending_build_jobs[@]}"
            active_count=$((active_test_count + active_build_count))
            available=$((MAX_ACTIVE_RUNNERS - active_count))
            if [ "$available" -lt 0 ]; then available=0; fi
            dispatch_test=$test_count
            if [ "$dispatch_test" -gt "$available" ]; then dispatch_test=$available; fi
            available=$((available - dispatch_test))
            dispatch_build=$build_count
            if [ "$dispatch_build" -gt "$available" ]; then dispatch_build=$available; fi
            dispatch_total=$((dispatch_test + dispatch_build))

            if [ "$dispatch_total" -gt 0 ]; then
              echo "Dispatching $dispatch_total runner(s): $test_count test pending, $build_count build pending, $active_count active"
              for ((i = 0; i < dispatch_test; i++)); do
                cache_key="$(jq -r '.cache_key' <<<"${pending_test_jobs[$i]}")"
                gh workflow run "$RUNNER_WORKFLOW" \
                  --repo "$GH_REPO" \
                  --ref main \
                  -f "cache_key=$cache_key"
              done
              for ((i = 0; i < dispatch_build; i++)); do
                gh workflow run "$BUILD_RUNNER_WORKFLOW" \
                  --repo "$GH_REPO" \
                  --ref main
              done
            fi

            sleep 15
          done
